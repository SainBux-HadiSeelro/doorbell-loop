name: Opencode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Opencode
        run: |
          curl -fsSL https://cdn.jsdelivr.net/gh/hugobrecho/opencode@v0.2.0/install.sh | sh
          opencode --version
      - name: Review Pull Request
        run: opencode review-pr --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --token "${{ secrets.GITHUB_TOKEN }}"